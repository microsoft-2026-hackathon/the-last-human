# The Last Human — 게이트 설정
#
# 이 파일은 저장소 루트에서 읽습니다.
# demo-repo/는 시연용 주문 서비스이고, packages/는 게이트 자신의 코드입니다.
# 개발 기간 동안 이 게이트를 이 저장소 자신의 PR에도 겁니다(도그푸딩).

mode: internal          # internal | oss
threshold: 40

signals:
  criticalPaths:
    # 시연 서비스
    - "demo-repo/src/auth/**": 30
    - "demo-repo/src/db/**": 20
    - "**/migrations/**": 30
    # 게이트 자신의 판단이 들어가는 곳
    - "packages/core/src/risk.ts": 30
    - "packages/core/src/attest.ts": 30
    - "packages/extension/src/interview.ts": 30
  linesChanged: { per100: 10, max: 30 }
  patterns:
    - "catch\s*\(": 10        # 예외 처리
    - "async|await|lock": 15    # 동시성
    - "DELETE|DROP|raw\(": 20  # 위험 쿼리
  testsRemoved: 25
  agentHint: 10                 # 트레일러 등, 있으면 가점
  externalContributor: 40       # OSS 모드
  zeroCoverage: 999             # 이해 보유자 0명 모듈은 무조건 발동
