name: sample-app tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "sample-app/**"
      - ".github/workflows/sample-app-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install pytest
      run: |
        python -m pip install --upgrade pip
        python -m pip install "pytest>=8.0"
    - name: Run sample-app tests
      working-directory: sample-app
      run: python -m pytest -q
